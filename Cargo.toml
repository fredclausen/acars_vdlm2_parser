[package]
name = "acars_vdlm2_parser"
version = "0.4.0"
edition = "2021"
authors = ["Alex Austin"]
description = "Library for decoding and encoding ACARS and VDLM2 messages"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.45"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "fast-rng", "macro-diagnostics"] }

[dev-dependencies]
byte-unit = "5.2.6"
chrono = "0.4.45"
criterion = "0.8.2"
glob = "0.3.4"
humantime = "2.4.0"
prettytable-rs = "0.10.0"
rand = "0.10.3"
rayon = "1.12.0"
thousands = "0.2.0"

[[bench]]
name = "message_processing"
harness = false
